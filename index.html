<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaybishow House — Table Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #f0ece4; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; padding: 28px 20px; }
    .page { max-width: 960px; margin: 0 auto; }

    .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
    .logo-accent { color: #c8a96e; }
    .subtitle { font-size: 12px; color: #555; margin-top: 4px; }
    .legend { display: flex; gap: 16px; align-items: center; padding-top: 6px; flex-wrap: wrap; }
    .leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
    .ctrl-group { display: flex; flex-direction: column; gap: 5px; }
    .ctrl-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.08em; }
    .controls input[type=date], .controls select {
      font-size: 13px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid #222;
      background: #151515; color: #f0ece4; outline: none;
    }
    .controls input[type=date]:focus, .controls select:focus { border-color: #c8a96e; }
    .refresh-btn {
      font-size: 13px; padding: 8px 16px;
      border-radius: 8px; border: 1px solid #222;
      background: #151515; color: #c8a96e; cursor: pointer;
    }
    .refresh-btn:hover { background: #1c1c1c; }

    .main-grid { display: grid; grid-template-columns: 1fr 280px; gap: 16px; }
    @media (max-width: 680px) { .main-grid { grid-template-columns: 1fr; } }

    .floor-plan {
      background: #111; border-radius: 14px;
      border: 1px solid #1e1e1e; padding: 20px;
    }
    .floor-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: #444; margin-bottom: 14px;
    }
    .floor-plan svg { display: block; width: 100%; }

    .sidebar { display: flex; flex-direction: column; gap: 12px; }

    .stat-card {
      background: #111; border-radius: 12px;
      border: 1px solid #1e1e1e; padding: 16px 18px;
    }
    .stat-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .stat-value { font-size: 32px; font-weight: 600; color: #f0ece4; line-height: 1; }
    .stat-sub { font-size: 11px; color: #444; margin-top: 4px; }

    .res-card {
      background: #111; border-radius: 12px;
      border: 1px solid #1e1e1e; overflow: hidden; flex: 1;
    }
    .res-head {
      padding: 12px 16px; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em; color: #444;
      border-bottom: 1px solid #1a1a1a;
    }
    .res-item {
      padding: 12px 16px; border-bottom: 1px solid #161616;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .res-item:last-child { border-bottom: none; }
    .res-name { font-size: 13px; font-weight: 500; color: #f0ece4; }
    .res-detail { font-size: 11px; color: #555; margin-top: 2px; }
    .res-badge {
      font-size: 10px; padding: 3px 9px; border-radius: 999px;
      background: #1a1830; color: #7F77DD; white-space: nowrap; font-weight: 500;
    }
    .empty { padding: 20px 16px; font-size: 12px; color: #444; text-align: center; }

    .status-bar {
      border-radius: 8px; border: 1px solid #1e1e1e;
      padding: 10px 14px; font-size: 12px; color: #555; margin-top: 14px;
    }
    .status-bar.ok { border-color: #1D9E75; color: #1D9E75; }
    .status-bar.err { border-color: #E24B4A; color: #E24B4A; }
    .status-bar.info { border-color: #7F77DD; color: #7F77DD; }

    .table-group { cursor: pointer; }
    .table-group:hover rect.table-body { opacity: 0.85; }
    .table-group:active rect.table-body { opacity: 0.65; }
  </style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div>
      <div class="logo">Kaybishow <span class="logo-accent">House</span></div>
      <div class="subtitle">Staff floor plan — live table status</div>
    </div>
    <div class="legend">
      <div class="leg"><div class="dot" style="background:#1D9E75;"></div>Open</div>
      <div class="leg"><div class="dot" style="background:#7F77DD;"></div>Booked</div>
      <div class="leg"><div class="dot" style="background:#E24B4A;"></div>Filled</div>
    </div>
  </div>

  <div class="controls">

    </div>

    </div>
    <div class="ctrl-group" style="justify-content:flex-end;">
      <button class="refresh-btn" onclick="loadStatus()">↻ Refresh</button>
    </div>
  </div>

            <circle cx="82" cy="205" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="82" cy="315" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="30" cy="235" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="30" cy="265" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="135" cy="235" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="135" cy="265" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <text x="82" y="252" font-size="12" font-weight="600" fill="#1D9E75" font-family="system-ui" text-anchor="middle">T4-1</text>
            <text x="82" y="267" font-size="10" fill="#1D9E75" font-family="system-ui" text-anchor="middle" opacity="0.6">4 seats</text>
            <text x="82" y="284" font-size="10" fill="#1D9E75" font-family="system-ui" text-anchor="middle" id="svg-status-T4-1">Open</text>
          </g>

          <!-- T4-2 -->
          <g class="table-group" id="svg-T4-2" onclick="toggleTable('T4-2')">
            <rect class="table-body" x="185" y="205" width="105" height="110" rx="8" fill="#0a2218" stroke="#1D9E75" stroke-width="1.5"/>
            <circle cx="237" cy="205" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="237" cy="315" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="185" cy="235" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="185" cy="265" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="290" cy="235" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="290" cy="265" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <text x="237" y="252" font-size="12" font-weight="600" fill="#1D9E75" font-family="system-ui" text-anchor="middle">T4-2</text>

            <text x="237" y="284" font-size="10" fill="#1D9E75" font-family="system-ui" text-anchor="middle" id="svg-status-T4-2">Open</text>

            <circle cx="65" cy="375" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="105" cy="375" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="145" cy="375" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="65" cy="443" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="105" cy="443" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="145" cy="443" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>

            <circle cx="260" cy="375" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="295" cy="375" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="330" cy="375" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="400" cy="375" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="260" cy="443" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="295" cy="443" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="330" cy="443" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <circle cx="400" cy="443" r="7" fill="#0a2218" stroke="#1D9E75" stroke-width="1.2"/>
            <text x="330" y="404" font-size="12" font-weight="600" fill="#1D9E75" font-family="system-ui" text-anchor="middle">T8-1</text>
            <text x="330" y="419" font-size="10" fill="#1D9E75" font-family="system-ui" text-anchor="middle" opacity="0.6">8 seats</text>
            <text x="330" y="435" font-size="10" fill="#1D9E75" font-family="system-ui" text-anchor="middle" id="svg-status-T8-1">Open</text>
          </g>

        </svg>
      </div>
      <div class="status-bar" id="statusBar">Loading live data...</div>
    </div>

    <div class="sidebar">
      <div class="stat-card">
        <div class="stat-label">Booked today</div>
        <div class="stat-value" id="statBooked">—</div>
        <div class="stat-sub" id="statSub">reservations</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Available now</div>
        <div class="stat-value" id="statOpen">—</div>
        <div class="stat-sub">tables at selected time</div>
      </div>
      <div class="res-card">
        <div class="res-head">Reservations</div>
        <div class="res-list" id="resList"><div class="empty">Loading...</div></div>
      </div>
    </div>
  </div>
</div>

<script>
  const GET_URL  = "https://o595a.app.n8n.cloud/webhook/restaurant-status";
  const POST_URL = "https://o595a.app.n8n.cloud/webhook/restaurant-table-update";

  const TABLES = [
    { id:"T2-1", seats:2 }, { id:"T2-2", seats:2 },
    { id:"T4-1", seats:4 }, { id:"T4-2", seats:4 },
    { id:"T6-1", seats:6 }, { id:"T8-1", seats:8 },
  ];

  const COLORS = {
    open:   { fill:"#0a2218", stroke:"#1D9E75", text:"#1D9E75" },
    booked: { fill:"#13112a", stroke:"#7F77DD", text:"#7F77DD" },
    filled: { fill:"#220a0a", stroke:"#E24B4A", text:"#E24B4A" },
  };

  const dateEl = document.getElementById("selDate");
  const timeEl = document.getElementById("selTime");
  dateEl.value = new Date().toISOString().slice(0,10);

  for (let m = 9*60; m <= 22*60; m += 30) {
    const h = String(Math.floor(m/60)).padStart(2,"0");
    const mn = String(m%60).padStart(2,"0");
    const o = document.createElement("option");
    o.value = `${h}:${mn}`; o.textContent = `${h}:${mn}`;
    if (h==="18" && mn==="00") o.selected = true;
    timeEl.appendChild(o);
  }

  dateEl.addEventListener("change", loadStatus);
  timeEl.addEventListener("change", renderAll);

  let liveReservations = [], liveWalkIns = [];

  function minutesFromTime(t) {
    const p = String(t||"").split(":").map(Number);
    return p.length < 2 ? null : p[0]*60+p[1];
  }

  function getTableState(id, date, time) {
    const s = minutesFromTime(time);
    if (s===null) return "open";
    const e = s+90;
    const all = [...liveReservations, ...liveWalkIns];
    const hit = all.find(r => {
      if (r.status==="cancelled"||r.status==="open") return false;
      if (r.date!==date||r.tableId!==id) return false;
      const os = minutesFromTime(r.time);
      if (os===null) return false;
      return s < os+(r.durationMinutes||90) && os < e;
    });
    if (!hit) return "open";
    return hit.source==="vapi" ? "booked" : "filled";
  }

  function updateSvgTable(id, state) {
    const g = document.getElementById("svg-"+id);
    if (!g) return;
    const c = COLORS[state];
    const rect = g.querySelector("rect.table-body");
    if (rect) { rect.setAttribute("fill", c.fill); rect.setAttribute("stroke", c.stroke); }
    g.querySelectorAll("circle").forEach(ci => {
      ci.setAttribute("fill", c.fill);
      ci.setAttribute("stroke", c.stroke);
    });
    g.querySelectorAll("text").forEach(tx => tx.setAttribute("fill", c.text));
    const st = document.getElementById("svg-status-"+id);
    if (st) st.textContent = state==="open" ? "Open" : state==="booked" ? "Booked" : "Filled";
  }

  function renderAll() {
    const date = dateEl.value, time = timeEl.value;
    let open = 0;
    TABLES.forEach(t => {
      const state = getTableState(t.id, date, time);
      updateSvgTable(t.id, state);
      if (state==="open") open++;
    });
    const todayRes = liveReservations.filter(r => r.date===date && r.status!=="cancelled");
    document.getElementById("statBooked").textContent = todayRes.length;
    document.getElementById("statOpen").textContent = open;
    renderResList(date);
  }

  function renderResList(date) {
    const list = document.getElementById("resList");
    const todays = liveReservations.filter(r => r.date===date && r.status!=="cancelled");
    if (!todays.length) {
      list.innerHTML = `<div class="empty">No reservations for ${date}</div>`;
      return;
    }
    list.innerHTML = todays
      .sort((a,b) => a.time.localeCompare(b.time))
      .map(r => `
        <div class="res-item">
          <div>
            <div class="res-name">${r.name||"Guest"}</div>
            <div class="res-detail">${r.time} · ${r.partySize} pax · ${r.tableId}</div>
          </div>
          <div class="res-badge">VAPI</div>
        </div>
      `).join("");
  }

  function setStatus(msg, type) {
    const bar = document.getElementById("statusBar");
    bar.textContent = msg;
    bar.className = "status-bar"+(type?" "+type:"");
  }

  async function loadStatus() {
    setStatus("Fetching live data...", "info");
    try {
      const res = await fetch(GET_URL);
      const data = await res.json();
      liveReservations = data.reservations||[];
      liveWalkIns = data.walkIns||[];
      renderAll();
      const count = liveReservations.filter(r=>r.date===dateEl.value&&r.status!=="cancelled").length;
      setStatus(`Live — ${count} reservation(s) on ${dateEl.value}. Last updated ${new Date().toLocaleTimeString()}.`, "ok");
    } catch(e) {
      setStatus("Could not connect to n8n — check workflow is published.", "err");
    }
  }

  async function toggleTable(id) {
    const date = dateEl.value, time = timeEl.value;
    if (!date||!time) { setStatus("Select a date and time first.", "err"); return; }
    const state = getTableState(id, date, time);
    const newStatus = state==="filled" ? "open" : "filled";
    setStatus(`Updating ${id}...`);
    try {
      const res = await fetch(POST_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ tableId:id, status:newStatus, date, time, timestamp:new Date().toISOString() })
      });
      if (res.ok) {
        if (newStatus==="filled") {
          liveWalkIns.push({ tableId:id, date, time, durationMinutes:90, status:"filled", source:"floor-plan" });
        } else {
          liveWalkIns = liveWalkIns.filter(w=>!(w.tableId===id&&w.date===date&&w.time===time));
          liveReservations = liveReservations.filter(r=>!(r.tableId===id&&r.date===date));
        }
        renderAll();
        setStatus(`${id} marked ${newStatus} on ${date} at ${time} ✓`, "ok");
      } else {
        setStatus(`Error ${res.status} — try again.`, "err");
      }
    } catch(e) {
      setStatus("Could not reach n8n.", "err");
    }
  }

  loadStatus();
  setInterval(loadStatus, 30000);
</script>
</body>
</html>
